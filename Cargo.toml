[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/codec",
    "crates/render",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# OLE Compound Document (container for .hwp binary). Pure Rust.
cfb = "0.10"

# DEFLATE for HWP5 DocInfo / BodyText streams. HWP uses RAW deflate (no zlib
# header) — `flate2::{read::DeflateDecoder, write::DeflateEncoder}`, not the
# Zlib* variants.
flate2 = "1.0"

# HWPX container: ZIP + XML inside. Pinned to versions whose MSRV fits
# this workspace's `rust-version = "1.85"` — newer releases of either
# crate require 1.88+.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.36"

# Legacy-image re-encoding — HTML preview inlines pictures as data URIs,
# so BMP / TIFF / WMF-that-the-image-crate-can-load get transcoded to
# JPEG before embedding since browsers render those inconsistently.
# Pinned to 0.25.2 — 0.25.10+ requires rustc 1.88 and this workspace
# is on 1.85 (see rust-toolchain.toml).
image = { version = "=0.25.2", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

# Reference parser — used by readers, not writers.
hwp = "*"

# Markdown CommonMark + tables parser for the MD → IR import path.
# Pure Rust, MSRV-friendly.
pulldown-cmark = "0.12"

# Standard base64 codec for the MD asset pipeline (data: URIs in
# split-asset .md pairs and inline-asset round-trips).
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
