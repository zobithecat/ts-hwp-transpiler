[package]
name = "hwp-transpiler-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hwp-transpiler-core = { path = "../core" }
hwp-transpiler-codec = { path = "../codec" }
hwp-transpiler-render = { path = "../render" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = ["console"]
