[package]
name = "hwp-transpiler-codec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hwp-transpiler-core = { path = "../core" }
cfb = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Asset pipeline: decode arbitrary picture bytes, resize for MD
# embedding, re-encode (lossless WebP) before base64-wrapping into
# the data URI.
image = { workspace = true }
base64 = { workspace = true }

[[bin]]
name = "hwp-roundtrip"
path = "src/bin/roundtrip.rs"

[[bin]]
name = "hwp-to-md"
path = "src/bin/hwp_to_md.rs"

[[bin]]
name = "md-to-hwpx"
path = "src/bin/md_to_hwpx.rs"
